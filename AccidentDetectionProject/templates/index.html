
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AccidentWatch - Live Monitoring</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0f14;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

header{
    height:60px;
    background:#111827;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.main{
    display:grid;
    grid-template-columns:72% 28%;
    height:calc(100vh - 60px);
}

.video{
    display:flex;
    align-items:center;
    justify-content:center;
    background:black;
}

.video img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.sidebar{
    background:#0f172a;
    padding:16px;
}

.status{
    border:2px solid #22c55e;
    padding:18px;
    border-radius:10px;
    text-align:center;
}

.status.danger{
    border-color:red;
}

.stats{
    margin-top:20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.stat{
    background:#020617;
    padding:14px;
    border-radius:10px;
    text-align:center;
}
</style>
</head>

<body>

<header>
<h2>AccidentWatch</h2>
<div id="clock"></div>
</header>

<div class="main">

<div class="video">
<img src="/video_feed">
</div>

<div class="sidebar">

<div class="status" id="statusBox">
<h2 id="statusText">ALL CLEAR</h2>
<p>Monitoring Traffic</p>
</div>

<div class="stats">
<div class="stat">
<h3 id="detections">0</h3>
<p>Detections</p>
</div>

<div class="stat">
<h3 id="confidence">5%</h3>
<p>Confidence</p>
</div>
</div>

</div>

</div>

<script>

async function poll(){
    const r = await fetch('/status')
    const d = await r.json()

    document.getElementById('detections').textContent = d.detections
    document.getElementById('confidence').textContent =
        Math.round(d.accident_conf * 100) + '%'

    const box = document.getElementById('statusBox')
    const txt = document.getElementById('statusText')

    if(d.accident){
        box.classList.add('danger')
        txt.textContent = 'ACCIDENT CONFIRMED'
    }else{
        box.classList.remove('danger')
        txt.textContent = 'ALL CLEAR'
    }
}

setInterval(poll, 1500)

setInterval(() => {
    document.getElementById('clock').textContent =
        new Date().toLocaleTimeString()
}, 1000)

</script>

</body>
</html>
